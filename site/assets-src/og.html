<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				position: relative;
				background:
					radial-gradient(ellipse 560px 420px at 14% 18%, rgba(110, 155, 255, 0.1), transparent 70%),
					#0a0a0b;
				color: #f4f4f5;
				font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
			}
			.copy {
				position: absolute;
				left: 72px;
				top: 72px;
				width: 540px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 16px;
				font-size: 30px;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			.brand img {
				width: 104px;
				height: 104px;
				margin: -12px -8px -12px -12px;
			}
			h1 {
				margin: 56px 0 20px;
				font-size: 56px;
				line-height: 1.04;
				font-weight: 700;
				letter-spacing: -0.035em;
			}
			p {
				margin: 0;
				color: #8e8e93;
				font-size: 24px;
				line-height: 1.4;
			}
			.pill {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				margin-top: 36px;
				padding: 14px 24px 14px 22px;
				border-radius: 999px;
				background: #f5f5f7;
				color: #000;
				font-size: 20px;
				font-weight: 600;
			}
			.pill svg {
				width: 17px;
				height: 21px;
			}
			.shot {
				position: absolute;
				left: 640px;
				top: 92px;
				width: 1180px;
				border-radius: 14px;
				box-shadow:
					0 0 0 1px rgba(255, 255, 255, 0.1),
					0 30px 80px rgba(0, 0, 0, 0.6);
			}
			.bar {
				position: absolute;
				left: 700px;
				top: 452px;
				display: flex;
				align-items: center;
				gap: 12px;
				width: 400px;
				height: 64px;
				padding: 0 10px 0 22px;
				border-radius: 20px;
				background: rgba(20, 20, 26, 0.55);
				backdrop-filter: blur(16px) saturate(180%);
				box-shadow:
					inset 0 0.5px 0 rgba(255, 255, 255, 0.35),
					inset 0 0 0 0.5px rgba(255, 255, 255, 0.16),
					0 20px 50px rgba(0, 0, 0, 0.55);
				font: 26px ui-monospace, 'SF Mono', Menlo, monospace;
			}
			.bar span {
				flex: 1;
			}
			.bar b {
				padding: 9px 14px;
				border-radius: 12px;
				background: linear-gradient(#fff, #e9e9ee);
				color: #1c1c1e;
				font-size: 18px;
			}
		</style>
	</head>
	<body>
		<div class="copy">
			<div class="brand"><img src="icon.svg" alt="" />Terminal</div>
			<h1>The market, one command away.</h1>
			<p>A fast, keyboard-driven market terminal for the Mac, written in Rust.</p>
			<div class="pill">
				<svg viewBox="0 0 17 21">
					<path
						d="M11.2 4.3c.6-.8 1-1.8.9-2.8-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.7 1 .1 2-.5 2.6-1.3zM12.1 5.8c-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.9-.8C4.4 5.9 3 6.8 2.2 8.1c-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.8 2.3 1.1 0 1.6-.7 2.9-.7 1.4 0 1.8.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.3 1.2-2.5 1.2-2.6 0 0-2.4-.9-2.4-3.6 0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7z"
					/>
				</svg>
				Free for macOS
			</div>
		</div>
		<img class="shot" src="hero-dark.png" alt="" />
		<div class="bar"><span>AAPL</span><b>GO</b></div>
	</body>
</html>
